name: CI

# Tests every package and builds the app on every push / PR (NFR-08). All
# macOS jobs run on macos-26: the test bundles link macOS-26-only frameworks
# (FoundationModels) and Swift 6.2 runtime symbols, so they refuse to load on
# older hosts — and the image's default toolchain is already the current
# Xcode 26, so no explicit selection is needed. Intelligence's live-model
# tests skip themselves when Apple Intelligence is unavailable.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test SPM packages
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        package:
          - Engine
          - Persistence
          - Interchange
          - Quotes
          - Rules
          - Reports
          - Shared
          - Intelligence
          - FeatureUI
          - CLI
    steps:
      - uses: actions/checkout@v7
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: Packages/${{ matrix.package }}
        # Not redundant with the test step: nothing in CLI's test target
        # depends on the finlens executable, so only `swift build` compiles it.
        run: swift build
      - name: Test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  license-headers:
    name: SPDX license header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every Swift source carries an SPDX header
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            if ! grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$file"; then
              echo "::error file=$file::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find Packages FinvestLensWidgets FinvestLensQuickLook \
                     finvestlens finvestlensTests finvestlensUITests \
                     -name '*.swift' -not -path '*/.build/*' -print0 2>/dev/null)
          exit $missing

  app:
    name: Build app + extensions (unsigned)
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v7
      - run: |
          xcodebuild build \
            -scheme finvestlens \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO
