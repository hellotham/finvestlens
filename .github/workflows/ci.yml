name: CI

# Tests every package and builds the app on every push / PR (NFR-08).
#
# The macOS jobs run on GitHub's `xcode-27` image: macOS 27 with Xcode 27 and
# the iOS 27 / macOS 27 SDKs and simulators. GitHub now labels its newest
# macOS image by Xcode major, not by `macos-NN`, which is why searching the
# runner list for "macos-27" finds nothing — these jobs sat on `macos-26`
# (Xcode 26) and failed at the first Foundation Models 27 call for three
# pushes on the strength of that search (corrected 12 Oct 2026). The
# deployment targets are 27.0 (PRD NFR-04), so nothing older can build this;
# the first step of each macOS job refuses a toolchain below 27 rather than
# letting a relabelled image fail somewhere less obvious. Intelligence's
# live-model tests skip themselves when Apple Intelligence is unavailable.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'LICENSE']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'website/**', 'LICENSE']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Test SPM packages
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        package:
          - Engine
          - Persistence
          - Interchange
          - Quotes
          - Rules
          - Reports
          - Cloud
          - Shared
          - Intelligence
          - FeatureUI
          - CLI
          - Lab
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain is Xcode 27 or later
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 27 ]; then
            echo "::error::Xcode $major selected; the 27.0 deployment targets need Xcode 27 or later"
            exit 1
          fi
      - name: Build
        working-directory: Packages/${{ matrix.package }}
        # Not redundant with the test step: nothing in CLI's test target
        # depends on the finlens executable, so only `swift build` compiles it.
        run: swift build
      - name: Test
        working-directory: Packages/${{ matrix.package }}
        # Every edit the app follows incrementally — the lookup indexes, the
        # account tree's balances, the general ledger, the incremental save —
        # is checked against a rebuild after the edit (AppModel
        # `verifiesKeptIndexes`). Only FeatureUI reads it; the rest ignore it.
        env:
          FL_VERIFY_INDEXES: "1"
        run: swift test

  license-headers:
    name: SPDX license header check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every Swift source carries an SPDX header
        run: |
          missing=0
          while IFS= read -r -d '' file; do
            if ! grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$file"; then
              echo "::error file=$file::missing SPDX-License-Identifier header"
              missing=1
            fi
          done < <(find Packages FinvestLensWidgets FinvestLensQuickLook \
                     finvestlens finvestlensTests finvestlensUITests \
                     -name '*.swift' -not -path '*/.build/*' -print0 2>/dev/null)
          exit $missing

  app:
    name: Build app + extensions (unsigned)
    runs-on: xcode-27
    strategy:
      fail-fast: false
      matrix:
        destination:
          - 'platform=macOS'
          - 'generic/platform=iOS Simulator'
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain is Xcode 27 or later
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          major=$(xcodebuild -version | awk 'NR==1 { split($2, v, "."); print v[1] }')
          if [ "$major" -lt 27 ]; then
            echo "::error::Xcode $major selected; the 27.0 deployment targets need Xcode 27 or later"
            exit 1
          fi
      # The app links MLX so that a model the person supplies can run in it
      # (`finvestlens/MLXModelLoader.swift`). mlx-swift's Cmlx target compiles
      # Metal shaders, and Xcode 27 ships the Metal toolchain as a component to
      # download: without it the build stops at "cannot execute tool 'metal'
      # due to missing Metal Toolchain". The same package carries a build-tool
      # plug-in (`CudaBuild`) that a headless build has nobody to trust on its
      # behalf, hence `-skipPackagePluginValidation` below.
      #
      # The download comes from Apple's asset server, which can fail the
      # catalog fetch outright: on 17 Oct 2026 it did ("Failed fetching catalog
      # for assetType (com.apple.MobileAsset.MetalToolchain)", exit 70) one push
      # after the same step had passed, and the macOS build went red with no
      # code at fault. So a failed download is tried twice more first.
      - name: Install the Metal toolchain
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadComponent MetalToolchain; then exit 0; fi
            echo "::warning::Metal toolchain download failed (attempt $attempt of 3)"
            if [ "$attempt" -lt 3 ]; then sleep $((attempt * 30)); fi
          done
          exit 1
      # `-emit-localized-strings` is passed through OTHER_SWIFT_FLAGS because
      # Xcode extracts only the targets that own a String Catalog — the app and
      # the extensions — and never the SPM packages, where most of the strings
      # live. The two sources are gathered separately below and checked, both
      # platforms together, by the `localization` job.
      - name: Build, extracting localized strings
        run: |
          mkdir -p strings/packages
          xcodebuild build \
            -scheme finvestlens \
            -destination '${{ matrix.destination }}' \
            -skipPackagePluginValidation \
            -derivedDataPath "$PWD/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_SWIFT_FLAGS="\$(inherited) -emit-localized-strings -emit-localized-strings-path $PWD/strings/packages"
      - name: Gather the app's and extensions' own stringsdata
        run: |
          rsync -a --prune-empty-dirs \
            --include='*/' --include='*.stringsdata' --exclude='*' \
            DerivedData/Build/Intermediates.noindex/ strings/targets/
      - uses: actions/upload-artifact@v6
        with:
          name: stringsdata-${{ strategy.job-index }}
          path: strings
          if-no-files-found: error

  no-real-data:
    name: No real financial data in published files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # docs/ and website/ are public. The reference book is one real
      # household's accounts. A hand-kept rule let a full financial profile —
      # net worth, super balance, portfolio value, realised gains — accumulate
      # in committed documentation as evidence that reports "matched to the
      # cent"; the evidence was worth keeping, the figures never were.
      - name: Published files carry no real balances
        run: python3 scripts/check-no-real-data.py

  localization:
    name: String catalogs match the compiler
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: strings
          pattern: stringsdata-*
      # Both platforms, because each compiles code the other does not: an
      # accessibility label inside an `#else` branch of `#if os(macOS)` shipped
      # untranslated for months while a macOS-only audit reported full coverage.
      # The check assigns each string to a catalog by the path of the source
      # it came from, and those paths are this runner's, not a developer's
      # Mac's: the scoping is tested on its own first, so that a wrong answer
      # reads as that and not as twenty missing keys.
      - name: A source path is assigned to the right catalog
        run: python3 scripts/check-localization.py --self-test
      - name: Every emitted key has an entry, every entry is emitted
        run: python3 scripts/check-localization.py --strings-dir strings --no-discover
      # A `String` emits no key, so the step above cannot see English held as
      # one; this reads the source against the same extraction. What no
      # reader meets is listed, with its reason, in
      # scripts/localization-exempt.tsv.
      - name: No English a reader meets is out of the compiler's sight
        run: python3 scripts/check-localization.py --strings-dir strings --no-discover --only-literals
